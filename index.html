function calc(v){
  var cls=S.cls[v.m]||'BM', pr=[], off=0, tw=0, ts=0;
  PK.forEach(function(p,i){
    var n=p.items.length, w=S.W[cls][i], s=0, sw=0;
    for(var j=0;j<n;j++){sw+=w[j]; s+=(v.v[off+j]||0)*w[j];}
    off+=n;
    var val=(v.ov&&v.ov[i]!=null)?v.ov[i]:(sw>0?s/sw:0);
    pr.push(val); tw+=S.pkw[i]; ts+=val*S.pkw[i];
  });
  return {pr:pr, all:tw>0?ts/tw:0};
}

/* استيراد Snag List من إكسل: يطابق بنص الملاحظة داخل كل فيلا، فيحدّث الحالة أو يضيف الجديد، ولا يحذف شيئاً */
function snNorm(s){return String(s==null?'':s).replace(/[\s‎‏]+/g,' ').trim().toLowerCase()}
function snMapSt(x){var s=String(x||'').trim();if(/مغلق|closed/i.test(s))return 'closed';if(/قيد|progress/i.test(s))return 'progress';return 'open'}
function readSnagExcel(file){
  if(!window.XLSX){$('#snimpmsg').textContent='تعذر تحميل مكتبة قراءة الإكسل. تأكد من الاتصال بالإنترنت.';return}
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var wb=XLSX.read(new Uint8Array(fr.result),{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
      var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:null,raw:true});
      var cL=5,cT=6,cS=7,start=4;
      for(var i=0;i<Math.min(rows.length,12);i++){
        var r=rows[i]||[],a=-1,b=-1,c=-1;
        r.forEach(function(x,k){var t=String(x||'');if(t.indexOf('رقم الفيلا')>=0)a=k;if(t.indexOf('الملاحظات')>=0)b=k;if(t.indexOf('الحالة')>=0)c=k});
        if(a>=0&&b>=0&&c>=0){cL=a;cT=b;cS=c;start=i+1;break}
      }
      var cur=null,file_items={};
      for(var j=start;j<rows.length;j++){
        var rw=rows[j]||[],lv=rw[cL];
        if(lv!=null&&lv!==''){var n=parseInt(String(lv).trim(),10);if(!isNaN(n))cur=n}
        var tx=rw[cT];if(!tx||cur==null)continue;
        (file_items[cur]=file_items[cur]||[]).push({t:String(tx).replace(/\s+/g,' ').trim(),s:snMapSt(rw[cS])});
      }
      var upd=[],add=[],same=0,unknown=[],lands=Object.keys(file_items).map(Number);
      lands.forEach(function(l){
        if(!villaOf(l)){unknown.push(l);return}
        var ex={};snItems(l).forEach(function(x){(ex[snNorm(x.text)]=ex[snNorm(x.text)]||[]).push(x)});
        var seq=snItems(l).reduce(function(m,x){return Math.max(m,x.seq)},0);
        file_items[l].forEach(function(f){
          var q=ex[snNorm(f.t)];
          if(q&&q.length){var x=q.shift();if(x.status===f.s)same++;else upd.push({x:x,s:f.s})}
          else{seq++;add.push({land:l,seq:seq,text:f.t,status:f.s})}
        });
      });
      SNIMP={upd:upd,add:add};
      var h='<p><b>'+esc(file.name)+'</b></p><div class="kpis" style="margin:8px 0"><div class="kpi"><b>'+lands.length+'</b><span>فلل في الملف</span></div><div class="kpi warn"><b>'+upd.length+'</b><span>تغيير حالة</span></div><div class="kpi warn"><b>'+add.length+'</b><span>ملاحظات جديدة</span></div><div class="kpi"><b>'+same+'</b><span>بلا تغيير</span></div></div>';
      if(unknown.length)h+='<p class="note">أرقام قطع غير موجودة في المنصة وتم تجاهلها: '+esc(unknown.slice(0,20).join('، '))+'</p>';
      if(!upd.length&&!add.length)h+='<p class="note">لا توجد تغييرات: كل ما في الملف مطابق لما في المنصة.</p>';
      else h+='<p class="note">المطابقة بنص الملاحظة داخل كل فيلا. لا يُحذف شيء من المنصة، وكل تغيير يُسجَّل باسمك.</p><div class="tools"><button class="btn pri" id="snimpgo" type="button">تطبيق التغييرات</button></div>';
      $('#snimpres').innerHTML=h;$('#snimpmsg').textContent='';
    }catch(e){$('#snimpmsg').textContent='تعذر قراءة الملف. تأكد أنه ملف إكسل (xlsx) بنفس شكل ملف السناق ليست.'}
  };
  fr.readAsArrayBuffer(file);
}

  else if(id==='exc')exportCSV(); else if(id==='impb')openImport(); else if(id==='impgo')applyImport();
  else if(id==='itexp')exportItem();
  else if(id&&id.indexOf('sn')===0)snClick(id);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&e.target.id==='snnew'){e.preventDefault();snClick('snadd')}
  if(e.key==='Enter'&&e.target.id==='pq'){e.preventDefault();planFind(e.target.value.trim())}
  if(e.key==='Enter'&&e.target.id==='snvl'){e.preventDefault();snClick('snaddv')}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('cell')){e.preventDefault();openEdit(e.target.dataset.edit)}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='fb'){filt.b=t.value;render()} else if(t.id==='fm'){filt.m=t.value;render()} else if(t.id==='fs'){filt.st=t.value;render()} else if(t.id==='fo'){filt.sort=t.value;render()}
  else if(t.id==='impf'&&t.files[0]){readExcel(t.files[0])}
  else if(t.id==='snimpf'&&t.files[0]){readSnagExcel(t.files[0])}
  else if(t.id==='itb2'){itBk=t.value;render()}
  else if(t.id==='sfb'){snf.b=t.value;render()} else if(t.id==='sfs'){snf.st=t.value;render()} else if(t.id==='sfo'){snf.sort=t.value;render()}
  else if(!canEdit())return;
  else if(t.dataset.snst!=null){snSetStatus(+t.dataset.snst,t.value)}
  else if(t.dataset.sntx!=null){snSetText(+t.dataset.sntx,t.value)}
  else if(t.dataset.it!=null){var v=curVilla();var x=t.value===''?null:Math.max(0,Math.min(100,parseFloat(t.value)))/100;v.v[+t.dataset.it]=isNaN(x)?null:x;persist(v);openEdit(v.l)}
  else if(t.dataset.ovr!=null){var v3=curVilla();v3.ov=v3.ov||{};if(t.value==='')delete v3.ov[+t.dataset.ovr];else v3.ov[+t.dataset.ovr]=Math.max(0,Math.min(100,parseFloat(t.value)))/100;persist(v3);openEdit(v3.l)}
  else if(t.dataset.pkw!=null){S.pkw[+t.dataset.pkw]=Math.max(0,parseFloat(t.value)||0)/100;persistSettings();render()}
  else if(t.dataset.cls!=null){S.cls[t.dataset.cls]=t.value;persistSettings();render()}
  else if(t.dataset.w!=null){var p=t.dataset.w.split(',');S.W[wcls][+p[0]][+p[1]]=Math.max(0,parseFloat(t.value)||0);persistSettings();render()}
});
document.addEventListener('input',function(e){if(e.target.id==='sfq'){snf.q=e.target.value.trim();var p2=e.target.selectionStart;render();var q2=$('#sfq');q2.focus();q2.setSelectionRange(p2,p2);return}
  if(e.target.id==='fq'){filt.q=e.target.value.trim();var pos=e.target.selectionStart;render();var q=$('#fq');q.focus();q.setSelectionRange(pos,pos)}});
(async function init(){
  applyLang();
  await loadRole(); await loadAll(); renderAuth(); render(); subscribe();
  if(LIVE)sb.auth.onAuthStateChange(function(ev){if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')afterAuth()});
})();
})();
</script>
